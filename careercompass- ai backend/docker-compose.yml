services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: careercompass
      POSTGRES_PASSWORD: careercompass
      POSTGRES_DB: careercompass
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    profiles: ["full"]        # docker compose --profile full up --build
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://careercompass:careercompass@db:5432/careercompass
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on: [db, redis]
volumes:
  pgdata:
